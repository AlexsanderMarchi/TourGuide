name: Build & push image

# Só dispara depois que for feito merge na master, garantindo que o
# build/testes já passaram e que não é um PR antes de gerar a imagem
on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Baixa o commit que acabou de ser mergeado na master
      - name: Checkout
        uses: actions/checkout@v4

      # Gera o nome da imagem em minúsculas (ghcr.io exige lowercase) e expõe como output
      - name: Lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      # Autentica no GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Configura o Buildx, necessário para builds com cache e recursos avançados
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builda e publica a imagem
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max