name: CI

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Baixa o código do repositório para o runner
      - name: Checkout
        uses: actions/checkout@v4

      # Instala o Node.js (manter a mesma versão do estágio de build do Dockerfile)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Instala as dependências com base no package-lock.json
      - name: Install dependencies
        run: npm ci

      # Checa os tipos (tsc -b) e builda a aplicação (vite build) para validar que o código compila
      - name: Build
        run: npm run build
