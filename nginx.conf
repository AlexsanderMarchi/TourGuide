# Proxy

# faz o papel de intermediario: Navegador ──► Proxy ──► Servidor
# esse proxy segue o proxy reverso, ou seja, ele recebe as requisições do navegador 
# e repassa para o back-end. No proxy foward, o cliente é que fica escondido do servidor(ex VPN).
server {
    listen 8080;                      # atende requisições na porta 8080
    root /usr/share/nginx/html;       # procura os arquivos nesta pasta (onde a dist foi copiada)

    location /api/ {                  # requisições que começam com /api/...
        proxy_pass http://api:8080;   # ...são repassadas ao back-end (proxy reverso)
    }

    location / {                      # todo o resto...
        try_files $uri $uri/ /index.html;  # ...entrega o arquivo pedido; se não existir, entrega o index.html
    }
}

# obs: o container do back precisa estar na mesma rede do container do front-end para que 
# o nginx consiga se comunicar com ele. Caso nao esteja, no navegador vai dar erro.